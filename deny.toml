[advisories]
version = 2
# Transitive via syntect / two-face (highlight-syntect); no fixed releases upstream yet.
ignore = ["RUSTSEC-2025-0141", "RUSTSEC-2024-0320"]

# `nucleo-matcher` / `nucleo` (MPL-2.0) are optional via the workspace `fuzzy` / `fuzzy-async` features.
[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
