[package]
name = "gallery"
description = "Interactive showcase of ratakit generic widgets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ratakit = { path = "../../crates/ratakit", features = [
    "widgets",
    "markdown",
    "highlight-syntect",
    "diff",
    "fuzzy",
    "crossterm",
    "tokio",
    "agent",
] }
ratakit-testing = { path = "../../crates/ratakit-testing" }
ratatui.workspace = true
ratatui-crossterm.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
futures-util = { workspace = true, features = ["std"] }
