[package]
name = "ratakit-agent"
description = "Agentic coding TUI state and widgets for ratakit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["widgets"]
widgets = [
    "dep:ratakit-widgets",
    "ratakit-widgets/fuzzy",
    "dep:ratatui-core",
    "dep:ratatui-widgets",
]
serde = ["dep:serde", "ratakit-core/serde"]

[dependencies]
ratakit-core = { workspace = true, features = ["fuzzy"] }
ratakit-text = { workspace = true, features = ["markdown", "diff"] }
ratakit-widgets = { workspace = true, optional = true, features = ["fuzzy"] }
ratatui-core = { workspace = true, optional = true }
ratatui-widgets = { workspace = true, optional = true }
serde = { version = "1.0.229", optional = true, features = ["derive"] }

[dev-dependencies]
proptest.workspace = true
ratakit-testing.workspace = true
ratatui.workspace = true
insta.workspace = true

[[test]]
name = "composer_snapshots"
path = "tests/composer_snapshots.rs"
required-features = ["widgets"]

[lints]
workspace = true
