[package]
name = "ratakit-agent"
description = "Agentic coding TUI state and widgets for ratakit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["widgets"]
widgets = [
    "dep:ratakit-widgets",
    "dep:ratatui-core",
    "dep:ratatui-widgets",
    "ratakit-text/highlight-syntect",
    "ratakit-widgets/diff",
    "ratakit-widgets/highlight-syntect",
]
serde = ["dep:serde", "ratakit-core/serde"]

[dependencies]
ratakit-core.workspace = true
ratakit-text = { workspace = true, features = ["markdown", "diff", "highlight-syntect"] }
ratakit-widgets = { workspace = true, optional = true }
ratatui-core = { workspace = true, optional = true }
ratatui-widgets = { workspace = true, optional = true }
serde = { version = "1.0.229", optional = true, features = ["derive"] }

[dev-dependencies]
proptest.workspace = true
ratakit-testing.workspace = true
ratatui.workspace = true
insta.workspace = true

[[test]]
name = "permission_prompt_state"
path = "tests/permission_prompt_state.rs"
required-features = ["widgets"]

[[test]]
name = "permission_prompt_snapshots"
path = "tests/permission_prompt_snapshots.rs"
required-features = ["widgets"]

[lints]
workspace = true
