[package]
name = "ratakit-agent"
description = "Agentic coding TUI state and widgets for ratakit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["widgets"]
widgets = [
    "dep:ratakit-widgets",
    "dep:ratatui-core",
    "dep:ratatui-widgets",
    "dep:unicode-width",
    "ratakit-core/fuzzy",
    "ratakit-text/highlight-syntect",
    "ratakit-widgets/diff",
    "ratakit-widgets/fuzzy",
    "ratakit-widgets/highlight-syntect",
    "ratakit-widgets/markdown",
]
serde = ["dep:serde", "ratakit-core/serde"]

[dependencies]
ratakit-core = { workspace = true, features = ["fuzzy"] }
ratakit-text = { workspace = true, features = ["markdown", "diff", "highlight-syntect"] }
ratakit-widgets = { workspace = true, optional = true, features = ["fuzzy"] }
ratatui-core = { workspace = true, optional = true }
ratatui-widgets = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }
unicode-segmentation.workspace = true
serde = { version = "1.0.229", optional = true, features = ["derive"] }

[dev-dependencies]
ratakit-core = { workspace = true, features = ["fuzzy"] }
ratakit-testing.workspace = true
ratakit-widgets = { workspace = true, features = ["diff", "highlight-syntect", "fuzzy"] }
ratatui.workspace = true
insta.workspace = true
proptest.workspace = true
ratakit-text = { workspace = true, features = ["highlight-syntect", "markdown", "diff"] }
criterion.workspace = true

[lints]
workspace = true

[[test]]
name = "composer_snapshots"
path = "tests/composer_snapshots.rs"
required-features = ["widgets"]

[[test]]
name = "model_picker_state"
path = "tests/model_picker_state.rs"
required-features = ["widgets"]

[[test]]
name = "model_picker_snapshots"
path = "tests/model_picker_snapshots.rs"
required-features = ["widgets"]

[[test]]
name = "permission_prompt_state"
path = "tests/permission_prompt_state.rs"
required-features = ["widgets"]

[[test]]
name = "permission_prompt_snapshots"
path = "tests/permission_prompt_snapshots.rs"
required-features = ["widgets"]

[[test]]
name = "tool_call_card_snapshots"
path = "tests/tool_call_card_snapshots.rs"
required-features = ["widgets"]

[[test]]
name = "usage_plan_snapshots"
path = "tests/usage_plan_snapshots.rs"
required-features = ["widgets"]

[[test]]
name = "transcript_snapshots"
path = "tests/transcript_snapshots.rs"
required-features = ["widgets"]

[[test]]
name = "transcript_scroll"
path = "tests/transcript_scroll.rs"
required-features = ["widgets"]

[[test]]
name = "agent_layout_snapshots"
path = "tests/agent_layout_snapshots.rs"
required-features = ["widgets"]

[[bench]]
name = "long_transcript"
harness = false
required-features = ["widgets"]
