[package]
name = "ratakit-text"
description = "Styled text, wrapping, and syntax highlighting for ratakit (no ratatui)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
markdown = ["dep:textwrap"]
highlight-syntect = ["dep:syntect", "dep:two-face"]
highlight-syntect-onig = ["highlight-syntect", "syntect/onig"]
highlight-treesitter = []
diff = ["dep:similar"]
fuzzy = []
fuzzy-async = []
serde = []

[dependencies]
ratakit-core.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
textwrap = { workspace = true, optional = true }
syntect = { workspace = true, optional = true, features = ["default-fancy"] }
two-face = { workspace = true, optional = true, features = ["syntect-default-fancy"] }
similar = { workspace = true, optional = true }

[dev-dependencies]
ratakit-core.workspace = true

[[test]]
name = "diff_model"
path = "tests/diff_model.rs"
required-features = ["diff"]

[lints]
workspace = true
