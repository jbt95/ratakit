[package]
name = "ratakit-widgets"
description = "Generic ratatui widgets for ratakit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
diff = ["ratakit-text/diff"]
highlight-syntect = ["ratakit-text/highlight-syntect"]
crossterm = []
tokio = []

[dependencies]
ratakit-core.workspace = true
ratakit-text.workspace = true
ratatui-core.workspace = true
ratatui-widgets.workspace = true
unicode-width.workspace = true

[dev-dependencies]
ratakit-testing.workspace = true
ratatui.workspace = true
insta.workspace = true
ratakit-text = { workspace = true, features = ["highlight-syntect", "diff"] }

[[example]]
name = "textarea_headless"
path = "examples/textarea_headless.rs"
test = true
