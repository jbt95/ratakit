[package]
name = "ratakit"
description = "Rust TUI component library on ratatui — generic widgets and agentic coding UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["widgets", "markdown", "highlight-syntect", "diff", "fuzzy", "crossterm"]
widgets = ["dep:ratakit-widgets"]
markdown = ["dep:ratakit-text", "ratakit-text/markdown"]
highlight-syntect = ["dep:ratakit-text", "ratakit-text/highlight-syntect"]
highlight-syntect-onig = ["dep:ratakit-text", "ratakit-text/highlight-syntect-onig"]
highlight-treesitter = ["dep:ratakit-text", "ratakit-text/highlight-treesitter"]
diff = ["dep:ratakit-text", "ratakit-text/diff"]
fuzzy = [
    "ratakit-core/fuzzy",
    "widgets",
    "ratakit-widgets/fuzzy",
    "dep:ratakit-text",
    "ratakit-text/fuzzy",
]
fuzzy-async = ["fuzzy", "ratakit-text/fuzzy-async"]
crossterm = ["widgets", "ratakit-widgets/crossterm"]
tokio = ["widgets", "ratakit-widgets/tokio"]
agent = ["dep:ratakit-agent"]
acp = ["agent", "dep:ratakit-acp", "tokio"]
serde = [
    "ratakit-core/serde",
    "dep:ratakit-text",
    "ratakit-text/serde",
    "ratakit-agent/serde",
]
unstable-acp = ["acp"]

[dependencies]
ratakit-core.workspace = true
ratakit-text = { workspace = true, optional = true }
ratakit-widgets = { workspace = true, optional = true }
ratakit-agent = { workspace = true, optional = true }
ratakit-acp = { workspace = true, optional = true }

# Milestone 0: default features match the design doc; stub crates expose matching feature names.

[dev-dependencies]
ratakit-testing.workspace = true
