[workspace]
resolver = "2"
members = [
    "crates/ratakit-core",
    "crates/ratakit-text",
    "crates/ratakit-widgets",
    "crates/ratakit-agent",
    "crates/ratakit-acp",
    "crates/ratakit-testing",
    "crates/ratakit",
    "examples/hello-headless",
    "examples/gallery",
    "examples/mock-agent",
    "examples/acp-app",
    "examples/claude-acp",
    "examples/opencode-acp",
]
default-members = ["crates/ratakit"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88.0"
repository = "https://github.com/jbt95/ratakit"
authors = ["Jordi Bermejo Tornero <jbt@example.com>"]

[workspace.dependencies]
ratakit-core = { path = "crates/ratakit-core", version = "0.0.0" }
ratakit-text = { path = "crates/ratakit-text", version = "0.0.0" }
ratakit-widgets = { path = "crates/ratakit-widgets", version = "0.0.0" }
ratakit-agent = { path = "crates/ratakit-agent", version = "0.0.0" }
ratakit-acp = { path = "crates/ratakit-acp", version = "0.0.0" }
ratakit-testing = { path = "crates/ratakit-testing", version = "0.0.0" }

unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
textwrap = { version = "0.16.4", default-features = false }
pulldown-cmark = "0.13.0"
proptest = "1.9.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
thiserror = "2.0.21"
similar = { version = "3.2.1", features = ["unicode", "inline"] }
criterion = "0.8.2"

ratatui-core = "0.1.2"
ratatui-widgets = "0.3.2"
ratatui = "0.30.2"
ratatui-crossterm = "0.1.2"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "event-stream"] }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
agent-client-protocol = { version = "=3.5.0", default-features = false, features = ["process"] }
serde_json = "1.0.154"

insta = { version = "1.49.0", features = ["redactions"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
